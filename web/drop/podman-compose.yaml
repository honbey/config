version: "3.9"

networks:
  local_containers:
    external: true

services:
  pairdrop:
    image: linuxserver/pairdrop:latest
    container_name: drop
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/config
    ports:
      - 0.0.0.0:1140:3000
    networks:
      local_containers:
        ipv4_address: 10.25.11.40
    logging:
      driver: k8s-file
      options:
        max-size: "10M"
